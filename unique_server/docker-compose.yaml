services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: unique
      POSTGRES_PASSWORD: "vTjOCPEjf_JcbwI6Fna05OViHnWTdgTh"
    volumes:
      - unique_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "iI42u6DTZwOToPPLD8psTHgi1oNHfL81"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: unique_test
      POSTGRES_PASSWORD: "ywpHTKL4OfJh_PQUEOPXbXpRqMRSCD_0"
    volumes:
      - unique_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "5dea49dFppUE7PryY7KHdVXzvmtkcoNg"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  unique_data:
  unique_test_data:
