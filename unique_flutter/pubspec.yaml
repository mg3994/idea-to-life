name: unique_flutter
description: A new Flutter project with Serverpod.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.40.0 <4.0.0'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^8.1.0
  unique_client:
    path: ../unique_client
  serverpod_flutter: 4.1.0-beta.1
  serverpod_auth_idp_flutter: 4.1.0-beta.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  bloc_signals_flutter: ^1.3.2
  kaisel: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  build: ^4.0.11
  build_runner: ^2.16.1
  drift_dev: ^2.34.1+1
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  kaisel_lint: ^0.5.0

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
